<!doctype html>
<html lang="en" data-theme="observatory">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04050a" />

    <title>ValuEngine</title>
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('ve.theme') || '"observatory"')
        document.documentElement.dataset.theme = theme === 'paper' ? 'paper' : 'observatory'
      } catch (e) {}
    </script>
