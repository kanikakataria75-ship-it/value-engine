[project]
name = "valuengine"
version = "2.0.0"
description = "Valuation, deal modelling and quantitative risk analytics over a local US + India equity dataset."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:formulas.*", "ignore::DeprecationWarning:schedula.*"]
